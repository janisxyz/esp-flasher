name: Release AAB

on:
  workflow_dispatch:
    inputs:
      play_track:
        description: Play track — internal, alpha (closed testing), or production
        type: choice
        options:
          - internal
          - alpha
          - production
        default: alpha
      version_name:
        description: Version name (default 1.0.0)
        required: false
        default: "1.0.0"
      release_notes:
        description: Optional Play / GitHub release notes
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: "tools platform-tools platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v5

      - name: Version for this run
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#v}"
            case "$NAME" in
              1) NAME="1.0.0" ;;
            esac
          elif [ -n "${{ github.event.inputs.version_name }}" ]; then
            NAME="${{ github.event.inputs.version_name }}"
            NAME="${NAME#v}"
          else
            NAME="1.0.0"
          fi
          echo "ESPFLASHER_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "ESPFLASHER_VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "versionName $NAME / versionCode ${{ github.run_number }}"

      - name: Resolve Play track
        run: |
          TRACK="${{ github.event.inputs.play_track }}"
          TRACK="${TRACK:-alpha}"
          echo "PLAY_TRACK=$TRACK" >> "$GITHUB_ENV"
          echo "Play track: $TRACK"

      - name: Generate release notes
        env:
          MANUAL_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          set -euo pipefail
          mkdir -p play-whatsnew fastlane/metadata/android/en-US/changelogs
          NOTES_FULL="$RUNNER_TEMP/release-notes.md"

          if [ -n "${MANUAL_NOTES:-}" ]; then
            printf '%s\n' "$MANUAL_NOTES" > "$NOTES_FULL"
          else
            {
              echo "What's new in ESP Flasher ${ESPFLASHER_VERSION_NAME}"
              echo
              echo "First closed-testing release. Flash ESP8266 and ESP32 (S2 / S3 / C3 / C6 / H2) over USB-OTG."
            } > "$NOTES_FULL"
          fi

          python3 - <<'PY'
          from pathlib import Path
          import os
          src = Path(os.environ["RUNNER_TEMP"]) / "release-notes.md"
          text = src.read_text(encoding="utf-8").strip() or f"ESP Flasher {os.environ.get('ESPFLASHER_VERSION_NAME', '')}"
          play = text if len(text) <= 500 else text[:497].rsplit("\n", 1)[0][:497].rstrip() + "…"
          Path("play-whatsnew/whatsnew-en-US").write_text(play + "\n", encoding="utf-8")
          Path("play-whatsnew/whatsnew-de-DE").write_text(play + "\n", encoding="utf-8")
          code = os.environ.get("ESPFLASHER_VERSION_CODE", "1")
          Path(f"fastlane/metadata/android/en-US/changelogs/{code}.txt").write_text(play + "\n", encoding="utf-8")
          print(play)
          PY

          echo "RELEASE_NOTES_FILE=$NOTES_FULL" >> "$GITHUB_ENV"

      - name: Prepare upload keystore
        env:
          STORE_BASE64: ${{ secrets.ESPFLASHER_STORE_BASE64 || secrets.ESPFLASHER_KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.ESPFLASHER_STORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.ESPFLASHER_KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.ESPFLASHER_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS="$HOME/espflasher-upload.jks"
          if [ -n "${STORE_BASE64:-}" ]; then
            echo "$STORE_BASE64" | base64 -d > "$KS"
            echo "Using upload keystore secret"
            echo "ESPFLASHER_STORE_PASSWORD=${SECRET_STORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "ESPFLASHER_KEY_ALIAS=${SECRET_KEY_ALIAS:-espflasher}" >> "$GITHUB_ENV"
            echo "ESPFLASHER_KEY_PASSWORD=${SECRET_KEY_PASSWORD}" >> "$GITHUB_ENV"
          else
            echo "No upload keystore secret — generating a CI keystore for this run"
            keytool -genkeypair -noprompt -keystore "$KS" -storepass android -keypass android \
              -alias espflasher -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=ESP Flasher CI, OU=Leftclick, O=Leftclick AG, L=Basel, C=CH"
            echo "ESPFLASHER_STORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "ESPFLASHER_KEY_ALIAS=espflasher" >> "$GITHUB_ENV"
            echo "ESPFLASHER_KEY_PASSWORD=android" >> "$GITHUB_ENV"
          fi
          echo "ESPFLASHER_KEYSTORE=$KS" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew --stacktrace testDebugUnitTest

      - name: Build release bundle
        run: ./gradlew --stacktrace bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: ESPFlasher-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release with AAB
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.ESPFLASHER_VERSION_NAME }}
          name: ESP Flasher ${{ env.ESPFLASHER_VERSION_NAME }}
          body_path: ${{ env.RELEASE_NOTES_FILE }}
          files: app/build/outputs/bundle/release/*.aab
          fail_on_unmatched_files: true

      - name: Write Play service account (optional)
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${PLAY_JSON:-}" ]; then
            echo "PLAY_SERVICE_ACCOUNT_JSON not set — skip Play upload"
            echo "PLAY_UPLOAD=0" >> "$GITHUB_ENV"
            exit 0
          fi
          printf '%s' "$PLAY_JSON" > "$HOME/play-sa.json"
          echo "PLAY_SA_FILE=$HOME/play-sa.json" >> "$GITHUB_ENV"
          echo "PLAY_UPLOAD=1" >> "$GITHUB_ENV"

      - name: Upload AAB to Google Play
        if: env.PLAY_UPLOAD == '1'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ env.PLAY_SA_FILE }}
          packageName: espflasher.shizoghost.com
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: ${{ env.PLAY_TRACK }}
          status: completed
          releaseName: ${{ env.ESPFLASHER_VERSION_NAME }}
          whatsNewDirectory: play-whatsnew
          mappingFile: app/build/outputs/mapping/release/mapping.txt
