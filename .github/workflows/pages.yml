name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Stage Pages site
        run: |
          set -euo pipefail
          mkdir -p site/privacy-policy site/privacy
          cp docs/.nojekyll site/
          cp docs/index.html site/index.html
          cp docs/index.html site/404.html
          cp docs/index.html site/privacy-policy.html
          cp docs/index.html site/privacy-policy/index.html
          cp docs/index.html site/privacy/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
