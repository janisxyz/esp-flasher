# Privacy policy is live at https://janisxyz.github.io/esp-flasher/
# via the user site janisxyz/janisxyz.github.io (folder esp-flasher/).
#
# Project Pages on this repo cannot be created with the grok-by-xai GitHub App
# (no `pages` permission) or GITHUB_TOKEN (no administration:write, so
# actions/configure-pages enablement:true returns 403).
# PiFlash works because Pages was already enabled on that repo.
#
# Source of truth: docs/index.html — copy to janisxyz.github.io/esp-flasher/
# when the policy changes. To switch to project Pages later: Settings → Pages
# → GitHub Actions (needs a token with pages:write), then restore the deploy
# job from janisxyz/PiFlash .github/workflows/pages.yml.

name: Privacy policy URL

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - .github/workflows/pages.yml
  workflow_dispatch:

jobs:
  verify-live-url:
    runs-on: ubuntu-latest
    steps:
      - name: Check https://janisxyz.github.io/esp-flasher/
        run: |
          set -euo pipefail
          html=$(curl -fsSL https://janisxyz.github.io/esp-flasher/)
          echo "$html" | grep -q 'Privacy Policy for ESP Flasher'
          echo "$html" | grep -q 'espflasher.shizoghost.com'
          echo "$html" | grep -q 'Leftclick AG'
          echo "OK https://janisxyz.github.io/esp-flasher/"
